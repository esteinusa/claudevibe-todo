{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to your planner</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Log In</button>
  </form>

  <p class="auth-link">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
{% endblock %}
