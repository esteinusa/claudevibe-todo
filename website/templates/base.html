<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Daily Planner{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      height: fit-content;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 32px;
    }

    /* Forms */
    form p { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: #0f0f13;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #e8e8f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #7c3aed;
    }

    ul.errorlist {
      list-style: none;
      color: #f87171;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .helptext {
      font-size: 0.75rem;
      color: #555;
      margin-top: 4px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      color: #fff;
      width: 100%;
      margin-top: 8px;
      padding: 12px;
    }

    .btn-primary:hover { opacity: 0.9; }

    .btn-icon {
      background: none;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 1rem;
      border-radius: 6px;
      transition: background 0.15s;
      color: #888;
    }

    .btn-icon:hover { background: #2a2a3a; color: #e8e8f0; }

    .btn-logout {
      background: none;
      border: 1px solid #2a2a3a;
      color: #888;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-logout:hover { border-color: #f87171; color: #f87171; }

    /* Auth page */
    .auth-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #666;
    }

    .auth-link a { color: #a78bfa; text-decoration: none; }
    .auth-link a:hover { text-decoration: underline; }

    /* Header bar */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .header-user { font-size: 0.8rem; color: #666; }

    /* Add todo form */
    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .add-form input {
      flex: 1;
    }

    .btn-add {
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .btn-add:hover { opacity: 0.9; }

    /* Todo list */
    .todo-list { list-style: none; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #1e1e2a;
    }

    .todo-item:last-child { border-bottom: none; }

    .todo-title {
      flex: 1;
      font-size: 0.95rem;
      color: #e8e8f0;
    }

    .todo-title.done {
      text-decoration: line-through;
      color: #444;
    }

    .empty-state {
      text-align: center;
      color: #444;
      font-size: 0.9rem;
      padding: 32px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
